<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¿Llegará melchor9 a 1000lp?</title>
  <meta name="description" content="Sancho Panza#1337 contra los 1000 LP: el seguimiento más importante de EUW.">
  <meta property="og:title" content="¿Llegará melchor9 a 1000lp?">
  <meta property="og:description" content="Sancho Panza#1337 contra los 1000 LP: el seguimiento más importante de EUW.">
  <meta name="theme-color" content="#f0a30a">
  <link rel="icon" href="assets/icon.png">
  <link rel="preload" href="assets/fonts/chango.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="trumpets" aria-hidden="true"></div>
  <div class="floaters" id="floaters" aria-hidden="true"></div>
  <canvas id="gragas" role="img" aria-label="Gragas en 3D dando vueltas sobre sí mismo"></canvas>

  <main class="page">
    <h1>¿Llegará melchor9 a&nbsp;1000lp?</h1>

    <div class="arena">
      <div class="stage" id="stage">
        <p class="hint">Dale click al Gragas para darle potensia</p>
        <p class="drunk-meter" id="drunk-meter" hidden>Borrachera: <span id="drunk-value">0</span>&nbsp;%</p>
      </div>
      <div class="stream" id="stream"></div>
    </div>

    <div class="bottom">
      <aside class="ticker" id="ticker" aria-label="Estadísticas con Gragas esta temporada" hidden>
        <div class="ticker-track" id="ticker-track"></div>
      </aside>

      <section class="meter dancer-left" aria-label="Progreso hacia los 1000 LP">
        <div class="meter-labels">
          <p class="current">
            <img src="assets/master.png" alt="" width="44" height="44">
            <span><strong id="lp">19 LP</strong> en <span id="tier">Maestro</span></span>
          </p>
          <p class="missing">Le faltan <strong id="left-lp">981 LP</strong> · <strong id="left-pct">98,1&nbsp;%</strong></p>
        </div>

        <div class="track-wrap">
          <canvas id="dancer" aria-hidden="true" style="--lp:1.9%"></canvas>
          <div class="track" id="track" role="progressbar" aria-label="LP conseguidos sobre 1000"
               aria-valuemin="0" aria-valuemax="1000" aria-valuenow="19">
            <div class="fill" id="fill" style="width:1.9%"></div>
            <span class="tick" style="left:25%"></span>
            <span class="tick" style="left:50%"></span>
            <span class="tick" style="left:75%"></span>
          </div>
        </div>

        <div class="meter-foot">
          <p><a href="https://op.gg/es/lol/summoners/euw/Sancho%20Panza-1337" target="_blank" rel="noopener">Sancho Panza#1337 en OP.GG</a> · Meta: 1000 LP</p>
          <p class="credit">Ver otras webs de djguilley: <a href="https://rockola-one.vercel.app" target="_blank" rel="noopener">Rockola</a> · <a href="https://tcg-universal-beta.vercel.app" target="_blank" rel="noopener">Universal TCG</a> · Made by djguilley</p>
        </div>
      </section>
    </div>
  </main>

  <div class="fx" id="fx" aria-hidden="true"></div>
  <p class="wasted" id="wasted" role="status">Vete a casa, Sancho Panza</p>

  <script type="module" src="main.js"></script>
</body>
</html>
